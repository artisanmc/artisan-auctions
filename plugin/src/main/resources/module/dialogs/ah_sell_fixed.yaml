schema: dialog/v1
title: { en: "Sell {item_name}", fr: "Vendre {item_name}", de: "{item_name} verkaufen", es: "Vender {item_name}" }
can_close_with_escape: true
body:
  - { type: text, text: { en: "<white>{quantity}× {item_name}", fr: "<white>{quantity}× {item_name}", de: "<white>{quantity}× {item_name}", es: "<white>{quantity}× {item_name}" } }
  - { type: text, text: { en: "<gray>Listed for {sale_duration}. Listing fee: {fee}. Sale tax: {tax}.", fr: "<gray>En vente pendant {sale_duration}. Frais de mise en vente : {fee}. Taxe sur la vente : {tax}.", de: "<gray>Angeboten für {sale_duration}. Einstellgebühr: {fee}. Verkaufssteuer: {tax}.", es: "<gray>En venta durante {sale_duration}. Comisión de publicación: {fee}. Impuesto de venta: {tax}." } }
  - { type: text, text: { en: "<gray>Price in {currency}, for the whole stack.", fr: "<gray>Prix en {currency}, pour toute la pile.", de: "<gray>Preis in {currency}, für den ganzen Stapel.", es: "<gray>Precio en {currency}, por toda la pila." } }
  - { type: text, text: { en: "<gray>Median price: <gold>{median}<gray> each, over {median_sales} sales in {median_days} days.", fr: "<gray>Prix médian : <gold>{median}<gray> l'unité, sur {median_sales} ventes en {median_days} jours.", de: "<gray>Medianpreis: <gold>{median}<gray> pro Stück, über {median_sales} Verkäufe in {median_days} Tagen.", es: "<gray>Precio mediano: <gold>{median}<gray> por unidad, en {median_sales} ventas en {median_days} días." } }
inputs:
  - { id: price, type: text, label: { en: "Price", fr: "Prix", de: "Preis", es: "Precio" }, default: "", max_length: 16 }
buttons:
  - id: confirm
    label: { en: "<green>Put on sale", fr: "<green>Mettre en vente", de: "<green>Zum Verkauf stellen", es: "<green>Poner en venta" }
    actions:
      - run_command: "auctions:sell sale {price}"
      - open_menu: ah_main
  - id: cancel
    label: { en: "Cancel", fr: "Annuler", de: "Abbrechen", es: "Cancelar" }
    actions: [ close_dialog ]
