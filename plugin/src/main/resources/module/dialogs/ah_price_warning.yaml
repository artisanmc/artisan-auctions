schema: dialog/v1
title: { en: "Check the price", fr: "Vérifiez le prix" }
can_close_with_escape: true
body:
  - { type: text, text: { en: "<white>{quantity}× {item_name}<reset> for <gold>{price}<reset> (<gold>{unit_price}<reset> each).", fr: "<white>{quantity}× {item_name}<reset> pour <gold>{price}<reset> (<gold>{unit_price}<reset> l'unité)." } }
  - { type: text, text: { en: "The median is <gold>{median}<reset> each over {median_sales} sales: your price is <yellow>{ratio}<reset>.", fr: "La médiane est de <gold>{median}<reset> l'unité sur {median_sales} ventes : votre prix est à <yellow>{ratio}<reset>." } }
buttons:
  - id: confirm
    label: { en: "<yellow>List it anyway", fr: "<yellow>Mettre en vente quand même" }
    actions:
      - run_command: "auctions:sell_confirm"
      - open_menu: ah_main
  - id: cancel
    label: { en: "Cancel", fr: "Annuler" }
    actions: [ close_dialog ]
