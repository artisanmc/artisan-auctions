schema: dialog/v1
title: { en: "Confirm the purchase", fr: "Confirmer l'achat", de: "Kauf bestätigen", es: "Confirmar la compra" }
can_close_with_escape: true
body:
  - { type: text, text: { en: "Buy <white>{quantity}× {name}<reset> from <white>{seller}<reset> for <gold>{price}<reset>?", fr: "Acheter <white>{quantity}× {name}<reset> à <white>{seller}<reset> pour <gold>{price}<reset> ?", de: "<white>{quantity}× {name}<reset> von <white>{seller}<reset> für <gold>{price}<reset> kaufen?", es: "¿Comprar <white>{quantity}× {name}<reset> a <white>{seller}<reset> por <gold>{price}<reset>?" } }
buttons:
  - id: confirm
    label: { en: "<green>Buy", fr: "<green>Acheter", de: "<green>Kaufen", es: "<green>Comprar" }
    actions:
      - run_command: "auctions:buy {id}"
      - open_previous_menu
  - id: cancel
    label: { en: "Cancel", fr: "Annuler", de: "Abbrechen", es: "Cancelar" }
    actions: [ open_previous_menu ]
