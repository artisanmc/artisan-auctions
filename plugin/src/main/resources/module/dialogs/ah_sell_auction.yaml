schema: dialog/v1
title: { en: "Auction {item_name}", fr: "Mettre aux enchères {item_name}", de: "{item_name} versteigern", es: "Subastar {item_name}" }
can_close_with_escape: true
body:
  - { type: text, text: { en: "<white>{quantity}× {item_name}", fr: "<white>{quantity}× {item_name}", de: "<white>{quantity}× {item_name}", es: "<white>{quantity}× {item_name}" } }
  - { type: text, text: { en: "<gray>Listing fee: {fee}. Sale tax: {tax}. Amounts in {currency}.", fr: "<gray>Frais de mise en vente : {fee}. Taxe sur la vente : {tax}. Montants en {currency}.", de: "<gray>Einstellgebühr: {fee}. Verkaufssteuer: {tax}. Beträge in {currency}.", es: "<gray>Comisión de publicación: {fee}. Impuesto de venta: {tax}. Importes en {currency}." } }
  - { type: text, text: { en: "<gray>Median price: <gold>{median}<gray> each, over {median_sales} sales in {median_days} days.", fr: "<gray>Prix médian : <gold>{median}<gray> l'unité, sur {median_sales} ventes en {median_days} jours.", de: "<gray>Medianpreis: <gold>{median}<gray> pro Stück, über {median_sales} Verkäufe in {median_days} Tagen.", es: "<gray>Precio mediano: <gold>{median}<gray> por unidad, en {median_sales} ventas en {median_days} días." } }
inputs:
  - { id: start, type: text, label: { en: "Opening bid", fr: "Mise de départ", de: "Startgebot", es: "Puja inicial" }, default: "", max_length: 16 }
  # Keep these options in step with auctions.durations in data/config.yaml.
  - id: duration
    type: single_option
    label: { en: "Duration", fr: "Durée", de: "Dauer", es: "Duración" }
    default: "24h"
    options:
      - { value: "1h", label: "1 h" }
      - { value: "6h", label: "6 h" }
      - { value: "12h", label: "12 h" }
      - { value: "24h", label: { en: "1 day", fr: "1 jour", de: "1 Tag", es: "1 día" } }
      - { value: "48h", label: { en: "2 days", fr: "2 jours", de: "2 Tage", es: "2 días" } }
  - { id: buyout, type: text, label: { en: "Buy-now price (optional, if allowed)", fr: "Prix d'achat immédiat (facultatif, si autorisé)", de: "Sofortkaufpreis (optional, falls erlaubt)", es: "Precio de compra inmediata (opcional, si se permite)" }, default: "", max_length: 16 }
buttons:
  - id: confirm
    label: { en: "<gold>Start the auction", fr: "<gold>Lancer l'enchère", de: "<gold>Auktion starten", es: "<gold>Iniciar la subasta" }
    actions:
      - run_command: "auctions:sell auction {start} {duration} {buyout}"
      - open_menu: ah_main
  - id: cancel
    label: { en: "Cancel", fr: "Annuler", de: "Abbrechen", es: "Cancelar" }
    actions: [ close_dialog ]
