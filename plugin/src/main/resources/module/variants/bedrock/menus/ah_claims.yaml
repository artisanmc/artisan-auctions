schema: menu/v1
# The 'bedrock' version of menus/ah_claims.yaml: same inputs, same actions.
title:
  - kind: background
    asset_id: bg_ah_claims
  - kind: plain
    value: {en: "<dark_gray>Claims box", fr: "<dark_gray>Récupération"}
size: 54
inputs:
  - name: claims
    type: list
    source: {ref: "auctions:claims"}
elements:
  - id: grid
    positions: "10-16,19-25,28-34,37-43"
    iterates: {source: claims, alias: c}
    item: "{c.icon}"
    lore:
      - ""
      - {en: "<gray>Kept for: <white>{c.expires_at.until()}", fr: "<gray>Conservé encore : <white>{c.expires_at.until()}"}
      - {en: "<yellow>Click to take it", fr: "<yellow>Cliquer pour le récupérer"}
    click:
      left: [run_command: "auctions:claim {c.id}"]
    states:
      - if: [expression: "c.is_money"]
        material: GOLD_INGOT
        title: "<gold>{c.amount_display}"
        lore:
          - {en: "<yellow>Click to receive it", fr: "<yellow>Cliquer pour le recevoir"}
        click:
          left: [run_command: "auctions:claim {c.id}"]
  - id: back
    positions: 45
    material: ARROW
    title: {en: "<white>Back", fr: "<white>Retour"}
    click: {left: [open_previous_menu]}
  - id: prev
    positions: 48
    material: ARROW
    title: {en: "<white>Previous page", fr: "<white>Page précédente"}
    click: {left: [pagination_prev: grid]}
    states:
      - if: [pagination_at_first: grid]
  - id: all
    positions: 49
    material: HOPPER
    title: {en: "<green>Take everything", fr: "<green>Tout récupérer"}
    lore:
      - {en: "<gray>What does not fit stays here", fr: "<gray>Ce qui ne rentre pas reste ici"}
    click: {left: [run_command: "auctions:claim all"]}
  - id: next
    positions: 50
    material: ARROW
    title: {en: "<white>Next page", fr: "<white>Page suivante"}
    click: {left: [pagination_next: grid]}
    states:
      - if: [pagination_at_last: grid]
  - id: close
    positions: 53
    material: BARRIER
    title: {en: "<red>Close", fr: "<red>Fermer"}
    click: {left: [close_menu]}
