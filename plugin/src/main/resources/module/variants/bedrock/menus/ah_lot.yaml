schema: menu/v1
# The 'bedrock' version of menus/ah_lot.yaml: same inputs, same actions.
title:
  - kind: background
    asset_id: bg_ah_lot
  - kind: plain
    value: {en: "<dark_gray>Lot contents", fr: "<dark_gray>Contenu du lot"}
size: 54
inputs:
  - {name: id, type: string, default: ""}
  - name: items
    type: list
    source:
      ref: "auctions:lot"
      params: {id: "{id}"}
elements:
  - id: grid
    positions: "0-44"
    iterates: {source: items, alias: i}
    item: "{i.icon}"
  - id: back
    positions: 49
    material: ARROW
    title: {en: "<white>Back", fr: "<white>Retour"}
    click: {left: [open_previous_menu]}
  - id: close
    positions: 53
    material: BARRIER
    title: {en: "<red>Close", fr: "<red>Fermer"}
    click: {left: [close_menu]}
