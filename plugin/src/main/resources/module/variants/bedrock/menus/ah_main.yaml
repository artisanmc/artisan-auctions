schema: menu/v1
# The 'bedrock' version of menus/ah_main.yaml: same inputs, every action on a tap (the only click
# Bedrock sends). The 'mode' button of the bottom bar picks what a tap on a listing does: buy or
# bid, buy an auction now, or see the lot's contents. 'mode' is a menu arg it sets, not an input.
title:
  - kind: plain
    value: {en: "<dark_gray>Auction House", fr: "<dark_gray>Hôtel des ventes"}
size: 54
inputs:
  - {name: tab, type: string, default: "all"}
  - {name: sort, type: string, default: "newest"}
  - {name: search, type: string, default: ""}
  - name: settings
    type: list
    source: {ref: "auctions:settings"}
  - name: summary
    type: list
    source: {ref: "auctions:summary"}
  - name: listings
    type: list
    source:
      ref: "auctions:listings"
      params: {tab: "{tab}", sort: "{sort}", search: "{search}"}
elements:
  - id: border
    positions: "0-2,4,7,9,17-18,26-27,35-36,44,51"
    material: GRAY_STAINED_GLASS_PANE
    title: " "

  # ── Type filter: one button that turns through all / sales / auctions,
  #    shown only when both kinds are enabled ──
  - id: filter
    positions: 3
    material: "{tab == \"all\" ? \"NETHER_STAR\" : \"\"}{tab == \"sale\" ? \"EMERALD\" : \"\"}{tab == \"auction\" ? \"GOLDEN_AXE\" : \"\"}"
    hide: [attributes]
    title:
      en: "<yellow>Show: <white>{tab == \"all\" ? \"All listings\" : \"\"}{tab == \"sale\" ? \"Fixed price\" : \"\"}{tab == \"auction\" ? \"Auctions\" : \"\"}"
      fr: "<yellow>Afficher : <white>{tab == \"all\" ? \"Toutes les annonces\" : \"\"}{tab == \"sale\" ? \"Prix fixe\" : \"\"}{tab == \"auction\" ? \"Enchères\" : \"\"}"
    lore:
      en:
        - "{tab == \"all\" ? \"<green>▸ \" : \"<gray>  \"}All listings"
        - "{tab == \"sale\" ? \"<green>▸ \" : \"<gray>  \"}Fixed price"
        - "{tab == \"auction\" ? \"<green>▸ \" : \"<gray>  \"}Auctions"
        - ""
        - "<gray>Tap: next filter"
      fr:
        - "{tab == \"all\" ? \"<green>▸ \" : \"<gray>  \"}Toutes les annonces"
        - "{tab == \"sale\" ? \"<green>▸ \" : \"<gray>  \"}Prix fixe"
        - "{tab == \"auction\" ? \"<green>▸ \" : \"<gray>  \"}Enchères"
        - ""
        - "<gray>Toucher : filtre suivant"
    click:
      left: [set_arg_cycle_next: {arg: tab, list: "all,sale,auction"}]
    states:
      # Only one kind is enabled: nothing to filter.
      - if: [not: {expression: "settings[0].both"}]
        material: GRAY_STAINED_GLASS_PANE
        title: " "
  - id: search
    positions: 5
    material: NAME_TAG
    title: {en: "<yellow>Search", fr: "<yellow>Rechercher"}
    lore:
      en:
        - '<gray>Tap: search by item or seller'
      fr:
        - '<gray>Toucher : chercher un objet ou un vendeur'
    click:
      left: [open_dialog: ah_search]
    states:
      - if: [expression: "search != \"\""]
        material: NAME_TAG
        enchanted: true
        title: {en: "<yellow>Search: <white>{search}", fr: "<yellow>Recherche : <white>{search}"}
        lore:
          en:
            - '<gray>Tap: new search'
          fr:
            - '<gray>Toucher : nouvelle recherche'
        click:
          left: [open_dialog: ah_search]

  - id: clear_search
    positions: 6
    material: GRAY_STAINED_GLASS_PANE
    title: " "
    states:
      - if: [expression: "search != \"\""]
        material: BARRIER
        title: {en: "<red>Clear the search", fr: "<red>Effacer la recherche"}
        click: {left: [set_arg: {arg: search, value: ""}]}
  - id: sort
    positions: 8
    material: HOPPER
    title: {en: "<yellow>Sort: <white>newest", fr: "<yellow>Tri : <white>plus récentes"}
    lore:
      en:
        - '<gray>Tap: next order'
      fr:
        - '<gray>Toucher : ordre suivant'
    click:
      left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
    states:
      - if: [expression: "sort == \"price_asc\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>cheapest", fr: "<yellow>Tri : <white>moins chères"}
        lore:
          en:
            - '<gray>Tap: next order'
          fr:
            - '<gray>Toucher : ordre suivant'
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
      - if: [expression: "sort == \"price_desc\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>most expensive", fr: "<yellow>Tri : <white>plus chères"}
        lore:
          en:
            - '<gray>Tap: next order'
          fr:
            - '<gray>Toucher : ordre suivant'
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
      - if: [expression: "sort == \"ending\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>ending soon", fr: "<yellow>Tri : <white>bientôt finies"}
        lore:
          en:
            - '<gray>Tap: next order'
          fr:
            - '<gray>Toucher : ordre suivant'
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]

  # ── The listings ──
  - id: grid
    positions: "10-16,19-25,28-34,37-43"
    iterates: {source: listings, alias: l}
    item: "{l.icon}"
    lore:
      en:
        - "<green>Fixed price"
        - ""
        - "<gray>Price: <gold>{l.price_display}"
        - "<gray>Seller: <white>{l.seller}"
        - "<gray>Ends in: <white>{l.ends_at.until()}"
        - "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
        - ""
        - "<yellow>Tap to buy"
      fr:
        - "<green>Prix fixe"
        - ""
        - "<gray>Prix : <gold>{l.price_display}"
        - "<gray>Vendeur : <white>{l.seller}"
        - "<gray>Fin dans : <white>{l.ends_at.until()}"
        - "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
        - ""
        - "<yellow>Toucher pour acheter"
    click:
      left:
        - open_dialog: {dialog_id: ah_confirm_buy, context: {id: "{l.id}", name: "{l.name}", price: "{l.price_display}", seller: "{l.seller}", quantity: "{l.quantity}"}}
    states:
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "view"}
        item: "{l.icon}"
        lore:
          en:
            - "<gray>Seller: <white>{l.seller}"
            - ""
            - "<yellow>Tap to see the lot's contents"
          fr:
            - "<gray>Vendeur : <white>{l.seller}"
            - ""
            - "<yellow>Toucher pour voir le contenu du lot"
        click:
          left:
            - open_menu: {menu_id: ah_lot, context: {id: "{l.id}"}}
      - if:
          - expression: "l.is_auction && l.buy_now && !l.own"
          - placeholder_equals: {placeholder: "{mode}", value: "buy_now"}
        item: "{l.icon}"
        lore:
          en:
            - "<gold>Auction"
            - ""
            - "<gray>Buy now: <gold>{l.buy_now_display}"
            - "<gray>Seller: <white>{l.seller}"
            - "<gray>Ends in: <white>{l.ends_at.until()}"
            - ""
            - "<yellow>Tap to buy now"
          fr:
            - "<gold>Enchère"
            - ""
            - "<gray>Achat immédiat : <gold>{l.buy_now_display}"
            - "<gray>Vendeur : <white>{l.seller}"
            - "<gray>Fin dans : <white>{l.ends_at.until()}"
            - ""
            - "<yellow>Toucher pour acheter tout de suite"
        click:
          left:
            - open_dialog: {dialog_id: ah_confirm_buy, context: {id: "{l.id}", name: "{l.name}", price: "{l.buy_now_display}", seller: "{l.seller}", quantity: "{l.quantity}"}}
      - if: [expression: "l.own"]
        item: "{l.icon}"
        lore:
          en:
            - "{l.is_auction ? \"<gold>Auction\" : \"<green>Fixed price\"}"
            - ""
            - "<gray>{l.is_auction ? \"Opening bid\" : \"Price\"}: <gold>{l.is_auction ? l.start_price_display : l.price_display}"
            - "{l.is_auction ? \"<gray>Bids: <white>\" : \"\"}{l.is_auction ? l.bid_count : \"\"}{l.has_bids ? \" <dark_gray>· <gray>best: <gold>\" : \"\"}{l.has_bids ? l.current_bid_display : \"\"}"
            - "<gray>Ends in: <white>{l.ends_at.until()}"
            - "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
            - ""
            - "<aqua>Your listing"
            - "<red>Tap to withdraw it"
          fr:
            - "{l.is_auction ? \"<gold>Enchère\" : \"<green>Prix fixe\"}"
            - ""
            - "<gray>{l.is_auction ? \"Mise de départ\" : \"Prix\"} : <gold>{l.is_auction ? l.start_price_display : l.price_display}"
            - "{l.is_auction ? \"<gray>Offres : <white>\" : \"\"}{l.is_auction ? l.bid_count : \"\"}{l.has_bids ? \" <dark_gray>· <gray>meilleure : <gold>\" : \"\"}{l.has_bids ? l.current_bid_display : \"\"}"
            - "<gray>Fin dans : <white>{l.ends_at.until()}"
            - "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
            - ""
            - "<aqua>Votre annonce"
            - "<red>Toucher pour la retirer"
        click:
          left:
            - run_command: "auctions:cancel {l.id}"
      - if: [expression: "l.is_auction"]
        item: "{l.icon}"
        lore:
          en:
            - "<gold>Auction"
            - ""
            - "<gray>Opening bid: <gold>{l.start_price_display}"
            - "<gray>Bids: <white>{l.bid_count} <dark_gray>· <gray>best: <gold>{l.has_bids ? l.current_bid_display : \"-\"}"
            - "<gray>Next bid from: <yellow>{l.min_bid_display}"
            - "<gray>Seller: <white>{l.seller}"
            - "<gray>Ends in: <white>{l.ends_at.until()}"
            - "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
            - ""
            - "{l.leading ? \"<green>You hold the best bid\" : \"<yellow>Tap to bid\"}"
            - "{l.buy_now ? \"<gray>Buy now for \" : \"\"}{l.buy_now ? l.buy_now_display : \"\"}{l.buy_now ? \"<gray>: change the tap mode below\" : \"\"}"
          fr:
            - "<gold>Enchère"
            - ""
            - "<gray>Mise de départ : <gold>{l.start_price_display}"
            - "<gray>Offres : <white>{l.bid_count} <dark_gray>· <gray>meilleure : <gold>{l.has_bids ? l.current_bid_display : \"-\"}"
            - "<gray>Prochaine offre dès : <yellow>{l.min_bid_display}"
            - "<gray>Vendeur : <white>{l.seller}"
            - "<gray>Fin dans : <white>{l.ends_at.until()}"
            - "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"
            - ""
            - "{l.leading ? \"<green>Vous avez la meilleure offre\" : \"<yellow>Toucher pour enchérir\"}"
            - "{l.buy_now ? \"<gray>Achat immédiat à \" : \"\"}{l.buy_now ? l.buy_now_display : \"\"}{l.buy_now ? \"<gray> : changer le mode ci-dessous\" : \"\"}"
        click:
          left:
            - open_dialog: {dialog_id: ah_bid, context: {id: "{l.id}", name: "{l.name}", min_bid: "{l.min_bid}", min_bid_display: "{l.min_bid_display}", seller: "{l.seller}"}}
  - id: back
    positions: 45
    material: GRAY_STAINED_GLASS_PANE
    title: " "
    states:
      - if: [expression: "has_previous_menu"]
        material: ARROW
        title: {en: "<white>Back", fr: "<white>Retour"}
        click: {left: [open_previous_menu]}
  - id: mine
    positions: 46
    material: CHEST
    title: {en: "<yellow>My listings <gray>({summary[0].mine}/{summary[0].limit})", fr: "<yellow>Mes annonces <gray>({summary[0].mine}/{summary[0].limit})"}
    click: {left: [open_menu: ah_mine]}
  - id: mode
    positions: 47
    material: EMERALD
    title: {en: "<yellow>A tap: <white>buy or bid", fr: "<yellow>Un toucher : <white>acheter ou enchérir"}
    lore:
      en:
        - "<gray>Tap to change what a tap on a listing does"
      fr:
        - "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"
    click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
    states:
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "view"}
        material: SPYGLASS
        title: {en: "<yellow>A tap: <white>see the lot's contents", fr: "<yellow>Un toucher : <white>voir le contenu du lot"}
        lore:
          en:
            - "<gray>Tap to change what a tap on a listing does"
          fr:
            - "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"
        click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "buy_now"}
        material: DIAMOND
        title: {en: "<yellow>A tap: <white>buy an auction now", fr: "<yellow>Un toucher : <white>achat immédiat d'une enchère"}
        lore:
          en:
            - "<gray>Tap to change what a tap on a listing does"
          fr:
            - "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"
        click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
  - id: prev
    positions: 48
    material: ARROW
    title: {en: "<white>Previous page", fr: "<white>Page précédente"}
    click: {left: [pagination_prev: grid]}
    states:
      - if: [pagination_at_first: grid]
        material: GRAY_STAINED_GLASS_PANE
        title: " "
  - id: sell
    positions: 49
    material: GOLD_INGOT
    title: {en: "<green>Sell the item in your hand", fr: "<green>Vendre l'objet en main"}
    lore:
      en:
        - "<gray>Hold the item, then click"
      fr:
        - "<gray>Tenez l'objet, puis cliquez"
    click: {left: [run_command: "auctions:sell_start"]}
    states:
      - if: [expression: "settings[0].read_only"]
        material: BARRIER
        title: {en: "<red>The house takes no new listings", fr: "<red>L'hôtel n'accepte plus d'annonces"}
  - id: next
    positions: 50
    material: ARROW
    title: {en: "<white>Next page", fr: "<white>Page suivante"}
    click: {left: [pagination_next: grid]}
    states:
      - if: [pagination_at_last: grid]
        material: GRAY_STAINED_GLASS_PANE
        title: " "
  - id: claims
    positions: 52
    material: ENDER_CHEST
    title: {en: "<yellow>Claims box <gray>({summary[0].claims})", fr: "<yellow>Récupération <gray>({summary[0].claims})"}
    lore:
      en:
        - "<gray>Bought, unsold and returned items"
      fr:
        - "<gray>Achats, invendus et objets rendus"
    click: {left: [open_menu: ah_claims]}
    states:
      - if: [expression: "summary[0].claims > 0"]
        material: ENDER_CHEST
        enchanted: true
        title: {en: "<gold>Claims box <gray>({summary[0].claims})", fr: "<gold>Récupération <gray>({summary[0].claims})"}
        lore:
          en:
            - "<gray>Bought, unsold and returned items"
          fr:
            - "<gray>Achats, invendus et objets rendus"
        click: {left: [open_menu: ah_claims]}
  - id: close
    positions: 53
    material: BARRIER
    title: {en: "<red>Close", fr: "<red>Fermer"}
    click: {left: [close_menu]}
