schema: menu/v1
# The 'bedrock' version of menus/ah_main.yaml: same inputs, every action on a tap (the only click
# Bedrock sends). The 'mode' button of the bottom bar picks what a tap on a listing does: buy or
# bid, buy an auction now, or see the lot's contents. 'mode' is a menu arg it sets, not an input.
title:
  - kind: background
    asset_id: bg_ah_main_bedrock
  - kind: plain
    value: {en: "<dark_gray>Auction House", fr: "<dark_gray>Hôtel des ventes"}
size: 54
inputs:
  - {name: tab, type: string, default: "all"}
  - {name: sort, type: string, default: "newest"}
  - {name: search, type: string, default: ""}
  - name: settings
    type: list
    source: {ref: "auctions:settings"}
  - name: summary
    type: list
    source: {ref: "auctions:summary"}
  - name: listings
    type: list
    source:
      ref: "auctions:listings"
      params: {tab: "{tab}", sort: "{sort}", search: "{search}"}
elements:
  - id: tab_all
    positions: 2
    states:
      - if: [expression: "settings[0].both && tab == \"all\""]
        material: NETHER_STAR
        enchanted: true
        title: {en: "<green>All listings", fr: "<green>Toutes les annonces"}
      - if: [expression: "settings[0].both"]
        material: NETHER_STAR
        title: {en: "<white>All listings", fr: "<white>Toutes les annonces"}
        click: {left: [set_arg: {arg: tab, value: "all"}]}
  - id: tab_sale
    positions: 3
    states:
      - if: [expression: "settings[0].both && tab == \"sale\""]
        material: EMERALD
        enchanted: true
        title: {en: "<green>Fixed price", fr: "<green>Prix fixe"}
      - if: [expression: "settings[0].both"]
        material: EMERALD
        title: {en: "<white>Fixed price", fr: "<white>Prix fixe"}
        click: {left: [set_arg: {arg: tab, value: "sale"}]}
  - id: tab_auction
    positions: 5
    states:
      - if: [expression: "settings[0].both && tab == \"auction\""]
        material: GOLDEN_AXE
        enchanted: true
        hide: [attributes]
        title: {en: "<green>Auctions", fr: "<green>Enchères"}
      - if: [expression: "settings[0].both"]
        material: GOLDEN_AXE
        hide: [attributes]
        title: {en: "<white>Auctions", fr: "<white>Enchères"}
        click: {left: [set_arg: {arg: tab, value: "auction"}]}

  - id: search
    positions: 4
    material: NAME_TAG
    title: {en: "<yellow>Search", fr: "<yellow>Rechercher"}
    lore:
      - {en: "<gray>Tap: search by item or seller", fr: "<gray>Toucher : chercher un objet ou un vendeur"}
    click:
      left: [open_dialog: ah_search]
    states:
      - if: [expression: "search != \"\""]
        material: NAME_TAG
        enchanted: true
        title: {en: "<yellow>Search: <white>{search}", fr: "<yellow>Recherche : <white>{search}"}
        lore:
          - {en: "<gray>Tap: new search", fr: "<gray>Toucher : nouvelle recherche"}
        click:
          left: [open_dialog: ah_search]

  - id: clear_search
    positions: 6
    states:
      - if: [expression: "search != \"\""]
        material: BARRIER
        title: {en: "<red>Clear the search", fr: "<red>Effacer la recherche"}
        click: {left: [set_arg: {arg: search, value: ""}]}
  - id: sort
    positions: 8
    material: HOPPER
    title: {en: "<yellow>Sort: <white>newest", fr: "<yellow>Tri : <white>plus récentes"}
    lore:
      - {en: "<gray>Tap: next order", fr: "<gray>Toucher : ordre suivant"}
    click:
      left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
    states:
      - if: [expression: "sort == \"price_asc\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>cheapest", fr: "<yellow>Tri : <white>moins chères"}
        lore:
          - {en: "<gray>Tap: next order", fr: "<gray>Toucher : ordre suivant"}
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
      - if: [expression: "sort == \"price_desc\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>most expensive", fr: "<yellow>Tri : <white>plus chères"}
        lore:
          - {en: "<gray>Tap: next order", fr: "<gray>Toucher : ordre suivant"}
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]
      - if: [expression: "sort == \"ending\""]
        material: HOPPER
        title: {en: "<yellow>Sort: <white>ending soon", fr: "<yellow>Tri : <white>bientôt finies"}
        lore:
          - {en: "<gray>Tap: next order", fr: "<gray>Toucher : ordre suivant"}
        click:
          left: [set_arg_cycle_next: {arg: sort, list: "newest,price_asc,price_desc,ending"}]

  # ── The listings ──
  - id: grid
    positions: "10-16,19-25,28-34,37-43"
    iterates: {source: listings, alias: l}
    item: "{l.icon}"
    lore:
      - ""
      - {en: "<gray>Price: <gold>{l.price_display}", fr: "<gray>Prix : <gold>{l.price_display}"}
      - {en: "<gray>Seller: <white>{l.seller}", fr: "<gray>Vendeur : <white>{l.seller}"}
      - {en: "<gray>Ends in: <white>{l.ends_at.until()}", fr: "<gray>Fin dans : <white>{l.ends_at.until()}"}
      - {en: "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}", fr: "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"}
      - ""
      - {en: "<yellow>Tap to buy", fr: "<yellow>Toucher pour acheter"}
    click:
      left:
        - open_dialog: {dialog_id: ah_confirm_buy, context: {id: "{l.id}", name: "{l.name}", price: "{l.price_display}", seller: "{l.seller}", quantity: "{l.quantity}"}}
    states:
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "view"}
        item: "{l.icon}"
        lore:
          - ""
          - {en: "<gray>Seller: <white>{l.seller}", fr: "<gray>Vendeur : <white>{l.seller}"}
          - ""
          - {en: "<yellow>Tap to see the lot's contents", fr: "<yellow>Toucher pour voir le contenu du lot"}
        click:
          left:
            - open_menu: {menu_id: ah_lot, context: {id: "{l.id}"}}
      - if:
          - expression: "l.is_auction && l.buy_now && !l.own"
          - placeholder_equals: {placeholder: "{mode}", value: "buy_now"}
        item: "{l.icon}"
        lore:
          - ""
          - {en: "<gray>Buy now: <gold>{l.buy_now_display}", fr: "<gray>Achat immédiat : <gold>{l.buy_now_display}"}
          - {en: "<gray>Seller: <white>{l.seller}", fr: "<gray>Vendeur : <white>{l.seller}"}
          - {en: "<gray>Ends in: <white>{l.ends_at.until()}", fr: "<gray>Fin dans : <white>{l.ends_at.until()}"}
          - ""
          - {en: "<yellow>Tap to buy now", fr: "<yellow>Toucher pour acheter tout de suite"}
        click:
          left:
            - open_dialog: {dialog_id: ah_confirm_buy, context: {id: "{l.id}", name: "{l.name}", price: "{l.buy_now_display}", seller: "{l.seller}", quantity: "{l.quantity}"}}
      - if: [expression: "l.own"]
        item: "{l.icon}"
        lore:
          - ""
          - {en: "<gray>Price: <gold>{l.price_display}", fr: "<gray>Prix : <gold>{l.price_display}"}
          - {en: "<gray>Ends in: <white>{l.ends_at.until()}", fr: "<gray>Fin dans : <white>{l.ends_at.until()}"}
          - {en: "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}", fr: "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"}
          - ""
          - {en: "<aqua>Your listing", fr: "<aqua>Votre annonce"}
          - {en: "<red>Tap to withdraw it", fr: "<red>Toucher pour la retirer"}
        click:
          left:
            - run_command: "auctions:cancel {l.id}"
      - if: [expression: "l.is_auction"]
        item: "{l.icon}"
        lore:
          - ""
          - {en: "<gray>Opening bid: <gold>{l.start_price_display}", fr: "<gray>Mise de départ : <gold>{l.start_price_display}"}
          - {en: "<gray>Bids: <white>{l.bid_count} <dark_gray>· <gray>best: <gold>{l.has_bids ? l.current_bid_display : \"-\"}", fr: "<gray>Offres : <white>{l.bid_count} <dark_gray>· <gray>meilleure : <gold>{l.has_bids ? l.current_bid_display : \"-\"}"}
          - {en: "<gray>Next bid from: <yellow>{l.min_bid_display}", fr: "<gray>Prochaine offre dès : <yellow>{l.min_bid_display}"}
          - {en: "<gray>Seller: <white>{l.seller}", fr: "<gray>Vendeur : <white>{l.seller}"}
          - {en: "<gray>Ends in: <white>{l.ends_at.until()}", fr: "<gray>Fin dans : <white>{l.ends_at.until()}"}
          - {en: "{l.has_median ? \"<gray>Median: <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>each (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}", fr: "{l.has_median ? \"<gray>Médiane : <white>\" : \"\"}{l.has_median ? l.median_display : \"\"}{l.has_median ? \" <gray>l'unité (\" : \"\"}{l.has_median ? l.median_ratio_display : \"\"}{l.has_median ? \"<gray>)\" : \"\"}"}
          - ""
          - {en: "{l.leading ? \"<green>You hold the best bid\" : \"<yellow>Tap to bid\"}", fr: "{l.leading ? \"<green>Vous avez la meilleure offre\" : \"<yellow>Toucher pour enchérir\"}"}
          - {en: "{l.buy_now ? \"<gray>Buy now for \" : \"\"}{l.buy_now ? l.buy_now_display : \"\"}{l.buy_now ? \"<gray>: change the tap mode below\" : \"\"}", fr: "{l.buy_now ? \"<gray>Achat immédiat à \" : \"\"}{l.buy_now ? l.buy_now_display : \"\"}{l.buy_now ? \"<gray> : changer le mode ci-dessous\" : \"\"}"}
        click:
          left:
            - open_dialog: {dialog_id: ah_bid, context: {id: "{l.id}", name: "{l.name}", min_bid: "{l.min_bid}", min_bid_display: "{l.min_bid_display}", seller: "{l.seller}"}}
  - id: back
    positions: 45
    states:
      - if: [expression: "has_previous_menu"]
        material: ARROW
        title: {en: "<white>Back", fr: "<white>Retour"}
        click: {left: [open_previous_menu]}
  - id: mine
    positions: 46
    material: CHEST
    title: {en: "<yellow>My listings <gray>({summary[0].mine}/{summary[0].limit})", fr: "<yellow>Mes annonces <gray>({summary[0].mine}/{summary[0].limit})"}
    click: {left: [open_menu: ah_mine]}
  - id: mode
    positions: 47
    material: EMERALD
    title: {en: "<yellow>A tap: <white>buy or bid", fr: "<yellow>Un toucher : <white>acheter ou enchérir"}
    lore:
      - {en: "<gray>Tap to change what a tap on a listing does", fr: "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"}
    click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
    states:
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "view"}
        material: SPYGLASS
        title: {en: "<yellow>A tap: <white>see the lot's contents", fr: "<yellow>Un toucher : <white>voir le contenu du lot"}
        lore:
          - {en: "<gray>Tap to change what a tap on a listing does", fr: "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"}
        click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
      - if:
          - placeholder_equals: {placeholder: "{mode}", value: "buy_now"}
        material: DIAMOND
        title: {en: "<yellow>A tap: <white>buy an auction now", fr: "<yellow>Un toucher : <white>achat immédiat d'une enchère"}
        lore:
          - {en: "<gray>Tap to change what a tap on a listing does", fr: "<gray>Toucher pour changer l'effet d'un toucher sur une annonce"}
        click: {left: [set_arg_cycle_next: {arg: mode, list: "view,buy_now,act"}]}
  - id: prev
    positions: 48
    material: ARROW
    title: {en: "<white>Previous page", fr: "<white>Page précédente"}
    click: {left: [pagination_prev: grid]}
    states:
      - if: [pagination_at_first: grid]
  - id: sell
    positions: 49
    material: GOLD_INGOT
    title: {en: "<green>Sell the item in your hand", fr: "<green>Vendre l'objet en main"}
    lore:
      - {en: "<gray>Hold the item, then click", fr: "<gray>Tenez l'objet, puis cliquez"}
    click: {left: [run_command: "auctions:sell_start"]}
    states:
      - if: [expression: "settings[0].read_only"]
        material: BARRIER
        title: {en: "<red>The house takes no new listings", fr: "<red>L'hôtel n'accepte plus d'annonces"}
  - id: next
    positions: 50
    material: ARROW
    title: {en: "<white>Next page", fr: "<white>Page suivante"}
    click: {left: [pagination_next: grid]}
    states:
      - if: [pagination_at_last: grid]
  - id: claims
    positions: 52
    material: ENDER_CHEST
    title: {en: "<yellow>Claims box <gray>({summary[0].claims})", fr: "<yellow>Récupération <gray>({summary[0].claims})"}
    lore:
      - {en: "<gray>Bought, unsold and returned items", fr: "<gray>Achats, invendus et objets rendus"}
    click: {left: [open_menu: ah_claims]}
    states:
      - if: [expression: "summary[0].claims > 0"]
        material: ENDER_CHEST
        enchanted: true
        title: {en: "<gold>Claims box <gray>({summary[0].claims})", fr: "<gold>Récupération <gray>({summary[0].claims})"}
        lore:
          - {en: "<gray>Bought, unsold and returned items", fr: "<gray>Achats, invendus et objets rendus"}
        click: {left: [open_menu: ah_claims]}
  - id: close
    positions: 53
    material: BARRIER
    title: {en: "<red>Close", fr: "<red>Fermer"}
    click: {left: [close_menu]}
