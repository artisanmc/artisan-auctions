auctions:
  messages:
    bad_command: "<red>This button is misconfigured."
    no_permission: "<red>You are not allowed to do that."
    error: "<red>Something went wrong; nothing was taken. Try again."
    vetoed: "<red>This action was refused."
    read_only: "<red>The auction house takes no new listings right now."
    no_item: "<red>Hold the item you want to sell."
    forbidden_item: "<red>This item cannot be sold here."
    item_changed: "<red>The item in your hand changed. Start again."
    limit_reached: "<red>You already have {limit} active listings."
    bad_amount: "<red>'{input}' is not a valid amount (at most two decimals)."
    bad_duration: "<red>This duration is not offered."
    sales_disabled: "<red>Fixed-price sales are disabled."
    auctions_disabled: "<red>Auctions are disabled."
    unknown_currency: "<red>The currency '{currency}' cannot be used here."
    price_required: "<red>Enter a price."
    price_out_of_bounds: "<red>The price must be between {min} and {max}."
    buyout_disabled: "<red>Buy-now prices are disabled."
    buyout_too_low: "<red>The buy-now price must be above the opening bid."
    cannot_pay_fee: "<red>You cannot pay the listing fee of {fee}."
    listed: "<green>{quantity}× {name}<green> is on sale for <gold>{price}<green>."
    gone: "<red>This listing is no longer available."
    not_for_sale: "<red>This listing cannot be bought outright."
    own_listing: "<red>This is your own listing."
    busy: "<gray>Already in progress…"
    insufficient_funds: "<red>You need <gold>{price}<red>."
    bought: "<green>You bought {quantity}× {name}<green> for <gold>{price}<green>."
    sold: "<green>{buyer} bought your {quantity}× {name}<green>. You receive <gold>{net}<green>."
    not_yours: "<red>This is not your listing."
    has_bids: "<red>This auction already has bids and cannot be withdrawn."
    cancelled: "<yellow>{quantity}× {name}<yellow> was withdrawn; it waits in your claims box."
    cancelled_by_admin: "<yellow>An administrator withdrew your {quantity}× {name}<yellow>; it waits in your claims box."
    expired: "<yellow>Your {quantity}× {name}<yellow> did not sell; it waits in your claims box."
    bid_received: "<green>{bidder} bid <gold>{amount}<green> on your {name}<green>."
    outbid: "<yellow>You were outbid on {name}<yellow>; <gold>{amount}<yellow> returns to you."
    claimed: "<green>You received {count} item(s) from your claims box."
    claimed_partly: "<yellow>You received {count} item(s); {left} stay in your claims box (inventory full)."
    inventory_full: "<red>Your inventory is full."
    nothing_to_claim: "<gray>Nothing to take."
    claims_paid: "<green>{count} payment(s) from the auction house were credited to you."
    claims_waiting: "<yellow>{count} item(s) wait in your auction house claims box: <white>/ah claim"
    not_an_auction: "<red>This listing is not an auction."
    already_leading: "<gray>You already hold the best bid."
    bid_too_low: "<red>The lowest bid is <gold>{min}<red>."
    outbid_meanwhile: "<red>Someone bid first; your money is back in your claims box."
    bid_placed: "<green>You bid <gold>{amount}<green> on {name}<green>."
    bid_placed_extended: "<green>You bid <gold>{amount}<green> on {name}<green>; the auction was extended."
    won: "<green>You won {quantity}× {name}<green> for <gold>{amount}<green>!"
