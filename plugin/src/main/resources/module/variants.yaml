schema: variants/v1
# The variants this module has versions for, in variants/<name>/. Which one a player sees is the
# server's: 'bedrock' for Bedrock players (their menus only take a tap, so these versions put
# every action on the left click), the module's own menus for everyone else, or the variant the
# player chose with /artisan variant. A menu the variant has no version of is the module's own.
variants: [bedrock]
