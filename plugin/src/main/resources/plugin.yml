name: ArtisanAuctions
version: '${version}'
main: net.artisanmc.auctions.AuctionsPlugin
api-version: '1.21'
depend: [Artisan]
description: Auction house for the Artisan suite (fixed-price sales and auctions)
commands:
  ah:
    description: Open the auction house
    usage: /ah [sell <price>|auction <start> [duration] [buy-now]|search <text>|mine|claim|admin]
    aliases: [auctionhouse, hdv]
    permission: auctions.use
permissions:
  auctions.use:
    description: Open the auction house
    default: true
  auctions.sell:
    description: List items for sale
    default: true
  auctions.bid:
    description: Bid on auctions
    default: true
  auctions.admin:
    description: Administer the auction house
    default: op
  auctions.limit.unlimited:
    description: No limit of active listings (auctions.limit.<n> sets one)
    default: false
