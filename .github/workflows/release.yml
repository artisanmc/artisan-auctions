name: Release

# ArtisanAuctions-<version>.jar on the Artisan site (its /modules/auctions/versions/ page; website README,
# "Versions and downloads"):
# - push to main: a development build, <version>-dev.<run> (<version>: the one of build.gradle.kts, the
#   release in preparation; notes: the pushed commits);
# - tag v<version>: the release <version> (notes: the tag's annotation, git tag -a).
# Needs the secret RELEASE_TOKEN.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The notes of a development build are the commits of the push.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(bash ./gradlew properties -q --no-daemon | awk '/^version:/ {print $2}')"
            VERSION="${BASE%-SNAPSHOT}-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' || { echo "bad version '$VERSION'" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew build -PauctionsVersion="$VERSION" --no-daemon
      - name: Publish on the Artisan site
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/publish-on-site.sh auctions "$VERSION" "plugin/build/libs/ArtisanAuctions-$VERSION.jar"
