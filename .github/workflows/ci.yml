name: CI

# Build and tests on every pull request and on main, so nothing reaches a release untested.
# Publishing is the job of release.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: bash ./gradlew build --no-daemon
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: plugin/build/reports/tests/

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The jar serves the committed bundle: it must be the build of editor/src.
      - name: The committed ui.js is up to date
        run: git diff --exit-code -- ../plugin/src/main/resources/artisan-editor/ui.js
